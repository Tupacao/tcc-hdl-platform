# Stack completa da VM (Azure B2s): Postgres, Redis, API e worker de simulacao.
# Uso: docker compose -f infra/docker-compose.yml up -d

name: tcc-hdl-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hdl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hdl}
      POSTGRES_DB: ${POSTGRES_DB:-hdl}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hdl}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-hdl}:${POSTGRES_PASSWORD:-hdl}@postgres:5432/${POSTGRES_DB:-hdl}
    ports:
      - '3333:3333'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-hdl-sandbox:latest}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-10000}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-128}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
    volumes:
      # O worker cria containers efemeros de simulacao no proprio host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Diretorio de trabalho compartilhado: o bind do sandbox e resolvido pelo host.
      - /tmp:/tmp
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
