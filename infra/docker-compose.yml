# Stack completa da VM (Azure B2s): Postgres, Redis, API e worker de simulacao.
# Uso: docker compose -f infra/docker-compose.yml up -d

name: tplab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tplab}
      POSTGRES_DB: ${POSTGRES_DB:-tplab}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tplab}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: um job de simulacao (fila BullMQ) nunca pode ser descartado em
    # silencio por pressao de memoria — a retencao quem controla e JOB_RETENTION_*
    # (RF03-I03), nao uma politica de cache do Redis.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-tplab}:${POSTGRES_PASSWORD:-tplab}@postgres:5432/${POSTGRES_DB:-tplab}
    ports:
      - '3333:3333'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Unico servico com acesso ao socket do Docker (RNF04-I02). Pequeno, sem dependencias, e so
  # encaminha ao daemon o que infra/docker-proxy/policy.mjs permite: criar/iniciar/aguardar/
  # ler logs/matar/remover containers COM O ROTULO do sandbox e com exatamente as opcoes de
  # sandbox.ts (nada de Privileged, Binds arbitrarios, exec, imagens, volumes, redes).
  # Nao publica porta: so o worker, pela rede do compose, alcanca o :2375.
  docker-proxy:
    image: node:22-alpine
    restart: unless-stopped
    command: ['node', '/proxy/proxy.mjs']
    environment:
      PROXY_ALLOWED_IMAGES: ${SANDBOX_IMAGE:-tplab-sandbox:latest},${SANDBOX_IMAGE_GHDL:-tplab-sandbox-ghdl:latest}
      PROXY_WORK_ROOT: ${SANDBOX_WORKDIR_ROOT:-/var/lib/tplab/work}
    volumes:
      - ./docker-proxy:/proxy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # O worker NAO monta o socket do Docker: fala com o proxy validador (RNF04-I02).
      DOCKER_HOST: tcp://docker-proxy:2375
      SANDBOX_WORKDIR_ROOT: ${SANDBOX_WORKDIR_ROOT:-/var/lib/tplab/work}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-tplab-sandbox:latest}
      SANDBOX_IMAGE_GHDL: ${SANDBOX_IMAGE_GHDL:-tplab-sandbox-ghdl:latest}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-10000}
      SANDBOX_COMPILE_TIMEOUT_MS: ${SANDBOX_COMPILE_TIMEOUT_MS:-5000}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-128}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
    volumes:
      # Diretorio dedicado dos fontes de cada job, montado no MESMO caminho no host e no worker: o
      # bind do container de simulacao e resolvido pelo daemon, no host. Substitui o /tmp
      # compartilhado — os fontes do usuario passam so por aqui, e e o unico caminho que o
      # proxy aceita em Binds.
      - ${SANDBOX_WORKDIR_ROOT:-/var/lib/tplab/work}:${SANDBOX_WORKDIR_ROOT:-/var/lib/tplab/work}
    depends_on:
      redis: { condition: service_healthy }
      docker-proxy: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
