name: CI Back

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-back.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-back.yml'

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formatacao (prettier)
        run: pnpm format:check

      - name: Build do @tplab/shared
        run: pnpm --filter @tplab/shared build

      - name: Typecheck
        run: pnpm --filter @tplab/api typecheck

      - name: Testes
        run: pnpm --filter @tplab/api test
