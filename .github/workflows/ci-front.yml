name: CI Front

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-front.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-front.yml'

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formatacao (prettier)
        run: pnpm format:check

      - name: Build do @tplab/shared
        run: pnpm --filter @tplab/shared build

      - name: Typecheck
        run: pnpm --filter @tplab/web typecheck

      - name: Build
        run: pnpm --filter @tplab/web build

      - name: Testes (se existirem)
        run: pnpm --filter @tplab/web run test --if-present
